# What CI can check without an AWS account.
#
# `check` runs `make check`, every scripts/ci/check-*.sh, so a laptop runs
# exactly what this job runs, and a new check lands as a new script without
# touching this file. Tools every check may need are installed here.
#
# `denylist` runs the denylist check alone. The pattern is a secret, and a
# runner receives secrets per job, so only a job of its own keeps it away from
# the tools and third-party code the other checks run. Both jobs are required.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned rather than latest, as in infra-central: a shellcheck release that
  # adds a check would otherwise start failing merges that had nothing to do
  # with it. The runner image ships an older one.
  SHELLCHECK_VERSION: 0.11.0
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  TOFU_VERSION: 1.12.5

jobs:
  check:
    runs-on: ubuntu-24.04
    # An absolute path: tofu does not expand `~` in this variable.
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into RUNNER_TEMP rather than /usr/local/bin, which needs sudo. The release
      # publishes no checksum file.
      - name: install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -f - -C "$RUNNER_TEMP" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # check-workflows.sh. The release publishes checksums, checked here.
      - name: install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # The wrapper rewrites tofu's output and exit handling for later
          # steps; the check wants the plain binary.
          tofu_wrapper: false

      # The registry serves providers from GitHub Releases, which throttles
      # unauthenticated downloads from the shared runner addresses, so a bad
      # minute would fail `tofu init` on a change that touched no provider.
      # With the cache, a download happens only when a lock file changes.
      # OpenTofu refuses to start when the cache directory is missing, and a
      # cache miss restores nothing, hence the mkdir.
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}

      # cmd/s3-ceiling's checks (check-go.sh) need the Go line go.mod names.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # No pattern here, so the denylist check skips; the denylist job runs it.
      - run: make check

  denylist:
    runs-on: ubuntu-24.04
    steps:
      # Full history, so the check can read every commit in the range it is
      # given.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commit range is the pull request's own commits, or what the push
      # added to main. A fork's pull request gets no secrets and may skip with
      # a notice; everywhere else a missing pattern fails the job.
      - run: bash scripts/ci/check-denylist.sh
        env:
          PUBLIC_DENYLIST_REGEX: ${{ secrets.PUBLIC_DENYLIST_REGEX }}
          DENYLIST_REQUIRED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          DENYLIST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DENYLIST_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
