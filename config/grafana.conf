# Where a run's results, and a traced run's scrubbed spans, go after the
# record is written (docs/runner.md, "Grafana"): the OTLP gateway of the
# team's Grafana Cloud stack, filecoinfoundation. The paths /v1/traces and
# /v1/metrics are appended. The credential is SSM <path>/grafana-otlp,
# `<instance id>:<token>`. Empty turns the step off.
GRAFANA_OTLP_ENDPOINT=https://otlp-gateway-prod-us-central-0.grafana.net/otlp
# The whole step's budget in seconds; an overrun logs a line and the run goes on.
GRAFANA_TIMEOUT_S=120
# No request larger than this many bytes.
GRAFANA_MAX_REQUEST_BYTES=4000000
