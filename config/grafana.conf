# Where a run's results, and a traced run's scrubbed spans, go after the
# record is written (docs/runner.md, "Grafana"): the Tempo and Prometheus of
# the team's Grafana Cloud stack, filecoinfoundation, as infra-nodes' dev node
# sends them. Each user is that service's instance ID; the password for both
# is the access policy token in SSM <path>/grafana-token. An empty endpoint or
# user turns that half off, and both off turn the step off.
#
# Tempo: OTLP over gRPC with TLS, host:port.
GRAFANA_TEMPO_ENDPOINT=tempo-us-central1.grafana.net:443
GRAFANA_TEMPO_USER=233235
# Prometheus: remote write.
GRAFANA_PROM_URL=https://prometheus-prod-10-prod-us-central-0.grafana.net/api/prom/push
GRAFANA_PROM_USER=475506
# The whole step's budget in seconds; an overrun logs a line and the run goes on.
GRAFANA_TIMEOUT_S=120
# A traced run adds this many seconds per GB of traces.jsonl, up to
# GRAFANA_TIMEOUT_MAX_S. At 10% a tier 2 nightly writes about 1.1 GB, which
# takes about 170 requests of 4 MB once scrubbed; its budget is about 280 s
# (docs/runner.md, "Tracing").
GRAFANA_TRACE_S_PER_GB=150
GRAFANA_TIMEOUT_MAX_S=600
# No request larger than this many bytes.
GRAFANA_MAX_REQUEST_BYTES=4000000
