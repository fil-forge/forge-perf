SMELT_REPO=fil-forge/smelt
# When set, the poller resolves smelt to this commit instead of main, and a
# set without a smelt SHA takes it. Empty: runs follow smelt main, and a smelt
# merge starts a run like any other instrument change. A commit set here must
# stay reachable from a branch, or carry a tag forge-perf/<yyyymmdd>-<sha12> in
# fil-forge/smelt, since a new box's mirror fetches branches and those tags.
SMELT_REF=
# Recorded as drill.settings.manifest; config/smelt-manifest.yml.tmpl is the file.
MANIFEST_NAME=perf-piri-1-postgres-s3
