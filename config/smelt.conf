SMELT_REPO=fil-forge/smelt
# When set, the poller resolves smelt to this commit instead of main, and a
# set without a smelt SHA takes it. It is the head of smelt's perf/shakedown
# branch, which merges the changes forge-perf needs (piri on external S3,
# indexing off, third-party image variables, image records, drill flags) until
# they reach main. Empty it then. The commit must carry a tag
# forge-perf/<yyyymmdd>-<sha12> in fil-forge/smelt: a new box's mirror reaches
# it only through that tag once the branch is rebuilt.
SMELT_REF=21940118fa1863e1f56f950959ad54e0d4d032c3
# Recorded as drill.settings.manifest; config/smelt-manifest.yml.tmpl is the file.
MANIFEST_NAME=perf-piri-1-postgres-s3
