# Latency groups for every service in smelt's compose model, read by
# scripts/host/netem.sh. A service must appear in exactly one list; a service
# in no list stops the run, so a service smelt adds cannot land in the wrong
# group unnoticed.
#
# NODE     shaped: a prio qdisc with netem on the forge-network interface delays
#          packets addressed to CENTRAL. A node service with no forge-network
#          address (piri-postgres sits only on piri-storage-net) is recorded
#          and left alone.
# CENTRAL  filter targets: each forge-network address becomes a u32 filter.
# OTHER    undelayed, in no filter. piri-minio is piri's in-stack MinIO, which
#          stacks started from smelt.yml run.
# ONESHOT  init containers, which must have exited 0 before shaping.

NODE="ingot ingot-postgres ingot-openbao piri-0 piri-postgres"
CENTRAL="upload postgres hilt hilt-postgres hilt-vault swarf swarf-postgres plc plc-postgres delegator signing-service dynamodb-local minio"
OTHER="blockchain email guppy indexer redis ipni piri-minio"
ONESHOT="ingot-openbao-init piri-postgres-init upload-init hilt-init ipni-init"
