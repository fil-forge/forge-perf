# The drill's source, fil-one/storage-qualification (private).
SQ_REPO=fil-one/storage-qualification
# While set, runs use this commit and harness main does not trigger a run.
# Empty: runs follow storage-qualification main, and a harness merge starts
# a run like any other instrument change.
SQ_PIN=
# How the box reaches the harness repository: app (a dedicated GitHub App's
# key in SSM <path>/harness-app; docs/operations.md, "The harness
# credential through a GitHub App")
# or deploy-key (a read-only deploy key in SSM <path>/harness-deploy-key, which
# needs deploy keys allowed in the fil-one organization).
# FORGE_PERF_HARNESS_AUTH overrides it for a local run.
SQ_AUTH=app
