# The trace collector a traced run starts beside the stack as forge-perf-otel
# (docs/runner.md, "Tracing"), image OTEL_COLLECTOR_IMAGE in images.lock.
#
# Services send OTLP to otel-collector:4318 on forge-network. Every span gets
# the run's ID as a resource attribute, so spans from services that do not
# read OTEL_RESOURCE_ATTRIBUTES (piri) carry it too. The file exporter writes
# one OTLP JSON ExportTraceServiceRequest per line into the run directory,
# which collect.sh puts in the private raw tarball. It neither rotates, which
# would drop the start of the drill, nor compresses, which would hide a
# credential from collect.sh's check. The collector's own counters on :8888
# (accepted, refused, dropped and failed spans) are scraped after the drill.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Refuses spans before the container's 2 GB memory limit is reached; the
  # refusals show in the scraped counters.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1536
    spike_limit_mib: 384
  resource:
    attributes:
      - key: forge_perf.run_id
        value: ${env:FORGE_PERF_RUN_ID}
        action: upsert
  batch: {}

exporters:
  file:
    path: /traces/traces.jsonl
    format: json

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [file]
