# 0: every run publishes as series calibration, which never lights a gate or
# moves the mercury. 1 once calibration has frozen the settings and measured
# the noise bands (docs/DESIGN.md §9).
SERIES_LIVE=1
# 1: the persistent box powers itself off when idle and a waker starts it
# again (docs/runner.md, "Sleeping"). 0: it stays on.
SLEEP_WHEN_IDLE=1
# Seconds a box stays up after boot before it may sleep.
SLEEP_MIN_AWAKE_S=600
