# Drop-in for docker.service, installed to /etc/systemd/system/docker.service.d/.
# Docker starts only once the instance store is formatted and bound under its
# volumes directory. If the NVMe unit fails, Docker stays down and no run
# starts: a daemon on root's empty volumes/ would run the benchmark on gp3
# without saying so.
[Unit]
Requires=forge-perf-nvme.service
After=forge-perf-nvme.service
RequiresMountsFor=/var/lib/docker/volumes
